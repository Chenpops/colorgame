<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CMAN Virtual Run 2026 · JUMP as ONE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy: #061C2C; --cream: #F7F5ED; --blue: #13B8E7; --pink: #F44D91; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--navy); color: var(--cream); font-family: Kanit, system-ui, sans-serif; }
  main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 20px; text-align: center; }
  .tag { font-size: 12px; letter-spacing: .18em; opacity: .75; margin-bottom: 18px; }
  h1 { font-size: 26px; font-weight: 700; margin: 0 0 10px; line-height: 1.3; }
  p { margin: 0 0 22px; opacity: .85; line-height: 1.55; max-width: 340px; }
  .spin { width: 44px; height: 44px; border-radius: 50%; border: 4px solid rgba(247,245,237,.2); border-top-color: var(--blue); animation: s 1s linear infinite; margin: 8px auto 22px; }
  @keyframes s { to { transform: rotate(360deg); } }
  .btn { display: block; width: 100%; max-width: 320px; margin: 0 auto 12px; padding: 14px 18px; border-radius: 14px; border: 0; font: 600 17px Kanit, sans-serif;
         background: var(--blue); color: var(--navy); text-decoration: none; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--cream); border: 2px solid rgba(247,245,237,.45); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="tag">CMAN VIRTUAL RUN 2026 · JUMP AS ONE</div>
  <div class="spin" id="spin"></div>
  <h1 id="title">กำลังเปิดผลของคุณ…</h1>
  <p id="text">ยืนยันตัวตนด้วยบัญชี LINE</p>
  <a class="btn" id="go" hidden>ดูแดชบอร์ด</a>
  <button class="btn" id="retry" hidden>ลองใหม่</button>
  <button class="btn ghost" id="close" hidden>กลับไปที่แชท</button>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// Bridge (no secrets): LINE ID token → Apps Script verifies it with LINE → personal dashboard link of the same person.
const CFG = {
  LIFF_ID: '2012054837-XOB68Bmf',
  API_URL: 'https://script.google.com/macros/s/AKfycbwokj9k4lFqjhl67YtKdZqtUIs71_tHAmaV0rSBmn-PKrOjykg9xifOHj0nMfMnBY07/exec'
};
const $ = id => document.getElementById(id);
function show(title, text, opts) {
  opts = opts || {};
  $('spin').hidden = true; $('title').textContent = title; $('text').textContent = text;
  $('go').hidden = !opts.url; if (opts.url) { $('go').href = opts.url; $('go').textContent = opts.label || 'ดูแดชบอร์ด'; }
  $('retry').hidden = !opts.retry;
  $('close').hidden = !(window.liff && liff.isInClient && liff.isInClient());
}
$('retry').onclick = () => location.reload();
$('close').onclick = () => { try { liff.closeWindow(); } catch (e) { } };
const to = new URLSearchParams(location.search).get('to') || 'me';

async function boot() {
  try {
    await liff.init({ liffId: CFG.LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    const idToken = liff.getIDToken();
    const res = await fetch(CFG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'vr_link', idToken: idToken, to: to }) });
    const r = await res.json();
    if (r.ok && r.registered) { location.replace(r.url); return; }
    if (r.ok) { show('ยังไม่ได้ลงทะเบียน', r.message, { url: r.url, label: 'ดูแดชบอร์ดรวม' }); return; }
    let tried = '1'; try { tried = sessionStorage.getItem('vr_relogin') || ''; sessionStorage.setItem('vr_relogin', '1'); } catch (e) { }
    if (r.expired && !tried) { liff.logout(); liff.login({ redirectUri: location.href }); return; }
    show('เปิดไม่สำเร็จ', r.message || 'ลองใหม่อีกครั้ง', { retry: true });
  } catch (e) {
    show('เชื่อมต่อไม่สำเร็จ', 'ตรวจอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง', { retry: true });
  }
}
boot();
</script>
</body>
</html>
